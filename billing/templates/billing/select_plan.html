<!DOCTYPE html>
<html>
<head>
    <title>{{ plan.name }}</title>
</head>
<body>

<h1>{{ plan.name }}</h1>

<p>{{ plan.description }}</p>

<h3>Resources</h3>

<ul>
    <li>{{ plan.cpu }} vCPU</li>
    <li>{{ plan.ram }} GB RAM</li>
    <li>{{ plan.storage }} GB Storage</li>
</ul>

<h3>Choose Billing Cycle</h3>

{% if error %}
    <p>{{ error }}</p>
{% endif %}

<form method="post">
    {% csrf_token %}

    <label>
        <input
            type="radio"
            name="billing_cycle"
            value="MONTHLY"
            required
        >
        Monthly — ₱{{ plan.monthly_price }}
    </label>

    <br>

    <label>
        <input
            type="radio"
            name="billing_cycle"
            value="YEARLY"
            required
        >
        Yearly — ₱{{ plan.yearly_price }}
    </label>

    <br><br>

    <button type="submit">
        Create Order
    </button>
</form>

<br>

<a href="{% url 'plans' %}">
    Back to Plans
</a>

</body>
</html>
