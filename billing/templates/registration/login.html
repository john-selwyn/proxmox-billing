{% extends 'billing/base.html' %}{% block title %}Login{% endblock %}{% block content %}
<section class="card auth">
<p class="eyebrow">CUSTOMER PORTAL</p>
<h1>Welcome back.</h1>
<p class="muted">Sign in to manage your orders and invoices.</p>
<form method="post">{% csrf_token %}{{ form.as_p }}{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}<button>Sign in</button>
</form>
<p>New here? <a href="{% url 'register' %}">Create an account</a>
</p>
</section>{% endblock %}
